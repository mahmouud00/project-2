# Builds the Windows programs on a GitHub Windows machine and publishes them as a pre-release:
#   MYTech-Desktop-Setup-<v>.exe     desktop program (Tauri, every PC in the factory)
#   MYTech-Server-Setup-<v>.exe      server installer (compiled server + PostgreSQL + Windows services)
#   MYTech-License-Tool-<v>.exe      MYTech licence tool (vendor only, never give it to customers)
# The server and the licence tool are compiled to native code with Nuitka (no Python sources ship).
name: windows-release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/youthful-maxwell-n6mca9"]
    paths: ["backend/**", "desktop/**", "deploy/windows/**", "tools/**", "VERSION", ".github/workflows/windows-release.yml"]

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NUITKA_VERSION: "2.7.12"

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install and test
        working-directory: desktop
        run: |
          npm ci
          npm test
          npm run typecheck
      - name: Build installer
        working-directory: desktop
        run: npx tauri build
      - name: Collect
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName "out/MYTech-Desktop-Setup-$v.exe"
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: out/*.exe

  server:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-server-${{ runner.os }}-${{ env.NUITKA_VERSION }}-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: nuitka-server-${{ runner.os }}-${{ env.NUITKA_VERSION }}-
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install ./backend "nuitka==${{ env.NUITKA_VERSION }}" ordered-set zstandard
      - name: Compile server and service launcher
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          python tools/release/build_server.py --out "build/stage/app/$v" --icon desktop/src-tauri/icons/icon.ico
          if ($LASTEXITCODE -ne 0) { throw "server compile failed" }
          python -m nuitka --onefile --assume-yes-for-downloads --mingw64 --windows-console-mode=attach `
            --output-dir=build/launcher --output-filename=mytech-service.exe `
            --windows-icon-from-ico=desktop/src-tauri/icons/icon.ico --product-name="MYTech Solutions Service" `
            --company-name="MYTech Solutions" --file-version=$v --product-version=$v deploy/windows/launcher.py
          if ($LASTEXITCODE -ne 0) { throw "launcher compile failed" }
          New-Item -ItemType Directory -Force build/stage/service, build/stage/scripts, build/stage/redist | Out-Null
          Copy-Item build/launcher/mytech-service.exe build/stage/service/
          Copy-Item deploy/windows/MYTechServer.xml build/stage/service/
          Copy-Item deploy/windows/setup-server.ps1, deploy/windows/uninstall-server.ps1, deploy/windows/update.ps1 build/stage/scripts/
          Copy-Item desktop/src-tauri/icons/icon.ico build/stage/icon.ico
      - name: Download PostgreSQL, WinSW, VC++ runtime
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $ok = $false
          foreach ($pg in "16.10-1", "16.9-1", "16.8-1", "16.6-1", "16.4-1") {
            try {
              Invoke-WebRequest "https://get.enterprisedb.com/postgresql/postgresql-$pg-windows-x64-binaries.zip" -OutFile pg.zip
              Write-Host "PostgreSQL $pg"; $ok = $true; break
            } catch { Write-Host "PostgreSQL $pg not available" }
          }
          if (-not $ok) { throw "no PostgreSQL binaries found" }
          Expand-Archive pg.zip -DestinationPath pgzip
          New-Item -ItemType Directory -Force build/stage/pgsql | Out-Null
          foreach ($d in "bin", "lib", "share") { Copy-Item -Recurse "pgzip/pgsql/$d" "build/stage/pgsql/$d" }
          Remove-Item -Recurse -Force build/stage/pgsql/bin/*pgAdmin* -ErrorAction SilentlyContinue
          Invoke-WebRequest "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe" -OutFile build/stage/service/MYTechServer.exe
          Invoke-WebRequest "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile build/stage/redist/vc_redist.x64.exe
      - name: Smoke test (real install on this machine)
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          $root = "C:\MYTechCI"
          Copy-Item -Recurse build/stage $root
          $pw = Join-Path $env:RUNNER_TEMP "pw.txt"
          [IO.File]::WriteAllText($pw, "Ci-Admin-Pass-123")
          powershell -NoProfile -ExecutionPolicy Bypass -File "$root\scripts\setup-server.ps1" -Root $root -Version $v `
            -CompanyCode CI -CompanyName "مصنع اختبار" -AdminPasswordFile $pw
          if ($LASTEXITCODE -ne 0) { Get-Content "$root\logs\install.log"; Get-ChildItem "$root\logs" ; throw "setup failed" }
          $info = Invoke-RestMethod http://localhost:8000/api/v1/system/info
          if ($info.version -ne $v -or $info.mode -ne "offline") { throw "unexpected info $($info | ConvertTo-Json)" }
          $health = Invoke-RestMethod http://localhost:8000/api/v1/system/health
          Write-Host "health: $($health | ConvertTo-Json -Compress)"
          $branding = Invoke-RestMethod http://localhost:8000/api/v1/system/branding
          if ($branding.company_code -ne "CI") { throw "branding $($branding | ConvertTo-Json)" }
          # no licence yet: login must be refused with the licence error (auth + database + licensing all ran)
          $body = @{ username = "admin"; password = "Ci-Admin-Pass-123"; device_key = "ci" } | ConvertTo-Json
          try { Invoke-RestMethod -Method Post http://localhost:8000/api/v1/auth/login -ContentType "application/json" -Body $body; throw "login without licence was accepted" }
          catch { if ($_.Exception.Response.StatusCode.value__ -ne 402) { throw "expected 402, got $($_.Exception.Message)" } }
          Push-Location "$root\config"; & "$root\app\$v\mytech-server.exe" backup --label ci; Pop-Location
          if ($LASTEXITCODE -ne 0) { throw "backup failed" }
          Get-Content "$root\license\fingerprint.txt"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$root\scripts\uninstall-server.ps1" -Root $root
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DMyVersion=$v" "/DStage=$PWD\build\stage" "/DOutDir=$PWD\out" deploy\windows\MYTechServer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          # compiled server folder for offline updates (signed into a .mtu by the licence tool)
          Compress-Archive -Path "build/stage/app/$v/*" -DestinationPath "out/MYTech-Server-Update-Payload-$v.zip"
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: |
            out/*.exe
            out/*.zip

  license-tool:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-tool-${{ runner.os }}-${{ env.NUITKA_VERSION }}-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: nuitka-tool-${{ runner.os }}-${{ env.NUITKA_VERSION }}-
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install ./backend "nuitka==${{ env.NUITKA_VERSION }}" ordered-set zstandard
      - name: Compile
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          python tools/release/build_license_tool.py --out "out/MYTech-License-Tool-$v.exe" --icon desktop/src-tauri/icons/icon.ico
          if ($LASTEXITCODE -ne 0) { throw "licence tool compile failed" }
      - name: Self test of the compiled tool
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          $p = Start-Process -FilePath "out/MYTech-License-Tool-$v.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "licence tool self test failed ($($p.ExitCode))" }
          Write-Host "self test passed"
      - uses: actions/upload-artifact@v4
        with:
          name: license-tool
          path: out/*.exe

  publish:
    needs: [desktop, server, license-tool]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Pre-release with the three programs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cat VERSION)
          tag="v$v-build.${{ github.run_number }}"
          ls -la dist
          gh release create "$tag" dist/*.exe dist/*.zip --prerelease --target "${{ github.sha }}" \
            --title "MYTech Solutions $v (build ${{ github.run_number }})" \
            --notes "Windows build of ${{ github.sha }}. Desktop program for every PC; server installer for the server PC; licence tool for MYTech only."
