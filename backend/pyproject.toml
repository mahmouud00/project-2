[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mytech-server"
version = "0.1.0"
description = "MYTech Solutions — window & door factory management backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "apscheduler>=3.10,<4",
  "zeroconf>=0.132",
  "httpx>=0.27",
  "jinja2>=3.1",
  "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.modules.documents" = ["templates/*.html", "fonts/*.woff2"]
"app.modules.field" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]
