[package]
name = "mytech-desktop"
version = "0.1.0"
description = "MYTech Solutions desktop client"
authors = ["MYTech Solutions"]
edition = "2021"

[lib]
name = "mytech_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
tauri = { version = "~2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "=2.7.1"

# phones: the technician's position comes from the phone's GPS
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-geolocation = "=2.4.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
